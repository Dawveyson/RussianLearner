# Android 发布流水线
# 触发：推送 v* 标签，或手动 workflow_dispatch。
# 产物：Android APK / AAB，汇总成一个 GitHub Release。
#
# 说明：
#  - Android 作业运行在 ubuntu；Runner 镜像已预装 Android SDK，故不再使用
#    android-actions/setup-android（它依赖已被移除的 legacy `tools` 包，在
#    cmdline-tools 16 上会以 "Failed to find package 'tools'" 失败）。
#  - 缺失的 platform / build-tools 由 AGP 自动下载，前提是已写入 license 文件。
#  - Android 正式签名通过 Secrets 提供（RU_KEYSTORE 等）；未配置时自动回退 debug 签名。
#  - 当前项目只维护 Android，Windows exe / macOS dmg 的构建作业已移除。

name: Release (Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Android ----------
  android:
    name: Android AAB / APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_DIR="${SDK_DIR:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_DIR/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_DIR/licenses/intel-android-extra-license"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK + AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease
        env:
          RU_KEYSTORE: ${{ secrets.RU_KEYSTORE }}
          RU_KEYSTORE_PASSWORD: ${{ secrets.RU_KEYSTORE_PASSWORD }}
          RU_KEY_ALIAS: ${{ secrets.RU_KEY_ALIAS }}
          RU_KEY_PASSWORD: ${{ secrets.RU_KEY_PASSWORD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------- 汇总发布 ----------
  release:
    name: Publish GitHub Release
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/**/*.apk
            artifacts/android/**/*.aab
          generate_release_notes: true
